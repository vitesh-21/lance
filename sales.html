<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Checkout System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #00ff66;
            margin: 0;
        }
        .terminal-card {
            width: 450px;
            border: 2px solid #00ff66;
            padding: 20px;
            background: #000;
            box-shadow: 0 0 20px #00ff66;
        }
        header h2 {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
        }
        .input-group {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label { width: 40%; }
        select, input {
            width: 55%;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 8px;
            outline: none;
        }
        .auto-field { border: 1px solid #00ff66; padding: 6px 10px; flex: 1; margin-left: 10px; text-align: center; }
        .add-btn {
            margin-top: 10px;
            width: 100%;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .add-btn:hover { background: #00ff66; color: #000; }
        .cart-section {
            margin-top: 15px;
            border-top: 1px dashed #00ff66;
            padding-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        #cartList div { border-bottom: 1px solid #003311; padding: 5px 0; font-size: 0.9rem; }
        .total-section { margin-top: 15px; font-size: 1.2rem; font-weight: bold; text-align: right; }
        .confirm-btn {
            margin-top: 15px;
            width: 100%;
            background: #00ff66;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .confirm-btn:hover { background: #00cc55; }
        #phoneGroup { display: none; }

        /* RECEIPT PRINT STYLES */
        #receipt-print {
            display: none;
            background: white;
            color: black;
            padding: 20px;
            width: 300px;
            font-family: 'Courier New', Courier, monospace;
        }

        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="terminal-card">
    <header>
        <h2><i class="fas fa-cash-register"></i> TERMINAL_POS v2.0</h2>
    </header>

    <main>
        <div class="input-group">
            <label>Product:</label>
            <select id="productSelect" onchange="updatePriceDisplay()">
                <option value="" disabled selected>-- Select Item --</option>
            </select>
        </div>

        <div class="input-group">
            <label>Quantity:</label>
            <input type="number" id="qtyInput" min="1" value="1">
        </div>

        <div class="input-group">
            <label>Price/Unit:</label>
            <span id="priceDisplay" class="auto-field">0.00</span>
        </div>

        <div class="input-group">
            <label>Pay Method:</label>
            <select id="paymentMethod" onchange="togglePhoneInput()">
                <option value="Cash">Cash</option>
                <option value="M-Pesa">M-Pesa</option>
                <option value="Card">Bank Card</option>
            </select>
        </div>

        <div class="input-group" id="phoneGroup">
            <label>M-Pesa No:</label>
            <input type="text" id="mpesaPhone" placeholder="2547XXXXXXXX">
        </div>

        <button class="add-btn" onclick="addToCart()">
            <i class="fas fa-cart-plus"></i> + Add to Cart
        </button>

        <div class="cart-section">
            <p><strong><i class="fas fa-list"></i> CURRENT BATCH</strong></p>
            <div id="cartList"></div>
        </div>

        <div class="total-section">
            TOTAL: Ksh <span id="grandTotal">0</span>
        </div>

        <button class="confirm-btn" onclick="confirmSale()">
            <i class="fas fa-check-circle"></i> [ PROCESS TRANSACTION ]
        </button>
    </main>
</div>

<div id="receipt-print">
    <center>
        <h3>OHM SMART SYSTEMS</h3>
        <p>Official Purchase Receipt</p>
        <p>---------------------------</p>
    </center>
    <div id="receipt-details"></div>
    <p>---------------------------</p>
    <div id="receipt-items"></div>
    <p>---------------------------</p>
    <h4 id="receipt-total" style="text-align: right;"></h4>
    <center>
        <p>Thank you for shopping!</p>
        <p id="receipt-date"></p>
    </center>
</div>

<script>
    let cart = [];
    let total = 0;

    function getLatestData() {
        return {
            products: JSON.parse(localStorage.getItem('products')) || [],
            sales: JSON.parse(localStorage.getItem('sales')) || []
        };
    }

    function loadProducts() {
        const { products } = getLatestData();
        const select = document.getElementById("productSelect");
        select.innerHTML = '<option value="" disabled selected>-- Select Item --</option>';
        products.forEach(p => {
            let currentStock = p.quantity !== undefined ? p.quantity : p.qty;
            let price = parseFloat(p.price || 0);
            let name = p.name || "Unnamed Product";
            if(currentStock > 0) {
                let opt = document.createElement("option");
                opt.value = p.id;
                opt.text = `${name} (Stock: ${currentStock})`;
                opt.dataset.price = price;
                opt.dataset.stock = currentStock;
                opt.dataset.realName = name;
                select.appendChild(opt);
            }
        });
    }

    function updatePriceDisplay(){
        let select = document.getElementById("productSelect");
        if(select.selectedIndex <= 0) return;
        let price = select.options[select.selectedIndex].dataset.price;
        document.getElementById("priceDisplay").innerText = parseFloat(price).toFixed(2);
    }

    function togglePhoneInput() {
        let method = document.getElementById("paymentMethod").value;
        document.getElementById("phoneGroup").style.display = (method === "M-Pesa") ? "flex" : "none";
    }

    function addToCart(){
        let select = document.getElementById("productSelect");
        let qtyInput = document.getElementById("qtyInput");
        let qty = parseInt(qtyInput.value);
        if(!select.value) { alert("Please select a product"); return; }
        let opt = select.options[select.selectedIndex];
        let stock = parseInt(opt.dataset.stock);
        let name = opt.dataset.realName;
        let price = parseFloat(opt.dataset.price);

        if(qty > stock) { alert(`Error: Only ${stock} units available!`); return; }

        let itemTotal = price * qty;
        cart.push({ id: select.value, name: name, qty: qty, price: price, total: itemTotal });
        total += itemTotal;
        updateCartUI();
        qtyInput.value = 1;
    }

    function updateCartUI(){
        let cartDiv = document.getElementById("cartList");
        cartDiv.innerHTML = cart.map(item => `
            <div>${item.name} x${item.qty} <span style="float:right">Ksh ${item.total.toFixed(2)}</span></div>
        `).join('');
        document.getElementById("grandTotal").innerText = total.toLocaleString();
    }

    function confirmSale(){
        if(cart.length === 0) { alert("Cart is empty!"); return; }
        let payment = document.getElementById("paymentMethod").value;
        let refCode = "";
        if(payment === "M-Pesa") {
            refCode = prompt("Enter M-Pesa Transaction Code:");
            if(!refCode) return;
        }

        let data = getLatestData();
        let products = data.products;
        let sales = data.sales;

        cart.forEach(cartItem => {
            let pIdx = products.findIndex(p => p.id == cartItem.id);
            if(pIdx !== -1) {
                if(products[pIdx].quantity !== undefined) products[pIdx].quantity -= cartItem.qty;
                if(products[pIdx].qty !== undefined) products[pIdx].qty -= cartItem.qty;
            }
        });

        let saleObj = {
            saleId: "POS-" + Date.now(),
            date: new Date().toLocaleString(),
            pName: cart.map(i => i.name).join(", "),
            items: cart,
            total: total,
            method: payment,
            code: refCode
        };
        sales.push(saleObj);

        localStorage.setItem('products', JSON.stringify(products));
        localStorage.setItem('sales', JSON.stringify(sales));

        // TRIGGER RECEIPT PRINTING
        generateReceipt(saleObj);
        
        // Reset POS
        cart = [];
        total = 0;
        updateCartUI();
        loadProducts();
    }

    function generateReceipt(sale) {
        document.getElementById("receipt-details").innerHTML = `
            ID: ${sale.saleId}<br>
            Pay: ${sale.method} ${sale.code ? '('+sale.code+')' : ''}
        `;
        document.getElementById("receipt-items").innerHTML = sale.items.map(i => 
            `<div>${i.name} x${i.qty} @${i.price} <span style="float:right">${i.total}</span></div>`
        ).join('');
        document.getElementById("receipt-total").innerText = `TOTAL: Ksh ${sale.total.toLocaleString()}`;
        document.getElementById("receipt-date").innerText = sale.date;

        window.print(); // Triggers the print dialog
    }

    window.addEventListener('storage', (e) => {
        if (e.key === 'products') loadProducts();
    });

    window.onload = loadProducts;
</script>
</body>
</html>
