<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #2c3e50; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; color: #27ae60; }
        .back { display: block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="card">
    <i class="fas fa-key fa-3x" style="color:#e67e22; margin-bottom:15px;"></i>
    <h2>Reset Password</h2>
    <p style="font-size: 0.8rem; color: #7f8c8d;">Enter your username to recover password</p>
    <input type="text" id="lookupUser" placeholder="Enter Username">
    <button onclick="recoverPassword()">Recover</button>
    <div id="result"></div>
    <a href="login.html" class="back">Back to Login</a>
</div>

<script>
    function recoverPassword() {
        const userVal = document.getElementById('lookupUser').value.trim();
        const resultDiv = document.getElementById('result');
        let users = JSON.parse(localStorage.getItem('systemUsers')) || [];
        
        const found = users.find(u => u.username === userVal);
        if(found) {
            resultDiv.innerText = "Your password is: " + found.password;
            resultDiv.style.color = "#27ae60";
        } else {
            resultDiv.innerText = "User not found!";
            resultDiv.style.color = "#e74c3c";
        }
    }
</script>
</body>
</html>
