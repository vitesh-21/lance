<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login | Stock System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Keeping your exact CSS styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .login-container {
            background: #ffffff; width: 100%; max-width: 400px; padding: 40px;
            border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center;
        }
        .login-header i { color: #3498db; margin-bottom: 15px; }
        .login-header h2 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 8px; letter-spacing: 1px; }
        .login-header p { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #95a5a6; }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; background: #f9f9f9;
        }
        .error-text {
            background: #fdeaea; color: #e74c3c; padding: 10px; border-radius: 6px;
            font-size: 0.85rem; margin-bottom: 15px; border: 1px solid #fadbd8; display: none;
        }
        button {
            width: 100%; padding: 12px; background: #3498db; color: white; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        button:hover { background: #2980b9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <i class="fas fa-boxes-stacked fa-3x"></i>
        <h2>STOCK MANAGER</h2>
        <p>Enter your credentials to manage inventory</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fas fa-user-shield"></i>
            <select id="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div id="error-message" class="error-text">
            <i class="fas fa-exclamation-circle"></i> <span id="error-desc"></span>
        </div>

        <button type="submit">
            <span>Login</span>
            <i class="fas fa-arrow-right"></i>
        </button>
    </form>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault(); // Stop page refresh

        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const errorDiv = document.getElementById('error-message');
        const errorDesc = document.getElementById('error-desc');

        // SIMULATED LOGIN LOGIC
        // In a real static site, you'd check against a hardcoded admin or an API
        if (user === "admin" && pass === "1234") {
            // Save session-like data to localStorage
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', role);

            // Redirect to your dashboard file (make sure this file exists in your repo)
            window.location.href = "admin.html"; 
        } else {
            errorDiv.style.display = "block";
            errorDesc.innerText = "Invalid credentials. Try admin / 1234";
        }
    }
</script>

</body>
</html>
