<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Stock System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 40px; border-radius: 12px; width: 350px; box-shadow: 0 20px 25px rgba(0,0,0,0.5); border-top: 5px solid #10b981; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; font-size: 13px; color: #4b5563; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; }
        .msg { padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; display: none; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
        .back { display: block; text-align: center; margin-top: 20px; text-decoration: none; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<div class="card">
    <h2><i class="fas fa-user-plus"></i> Register</h2>
    <div id="messageBox" class="msg"></div>
    <form onsubmit="handleRegister(event)">
        <label>Username</label><input type="text" id="username" required>
        <label>Password</label><input type="password" id="password" required>
        <label>Role</label>
        <select id="role"><option value="staff">staff</option><option value="admin">admin</option></select>
        <button type="submit">Create Account</button>
        <a href="login.html" class="back">← Back to Login</a>
    </form>
</div>

<script>
    function handleRegister(event) {
        event.preventDefault();
        const userVal = document.getElementById('username').value.trim();
        const passVal = document.getElementById('password').value;
        const roleVal = document.getElementById('role').value;
        const msgDiv = document.getElementById('messageBox');

        let users = JSON.parse(localStorage.getItem('systemUsers')) || [];

        if (users.find(u => u.username === userVal)) {
            msgDiv.innerText = "Username taken!";
            msgDiv.className = "msg error";
            msgDiv.style.display = "block";
        } else {
            users.push({username: userVal, password: passVal, role: roleVal});
            localStorage.setItem('systemUsers', JSON.stringify(users));
            msgDiv.innerText = "Account Created!";
            msgDiv.className = "msg success";
            msgDiv.style.display = "block";
        }
    }
</script>
</body>
</html>
