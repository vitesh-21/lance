<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login | Stock System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern UI Styling */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1e272e, #2f3640);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-header h2 { color: #2c3e50; margin-bottom: 20px; letter-spacing: 1px; }

        .input-group { position: relative; margin-bottom: 15px; }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            background: #f9f9f9;
            font-size: 1rem;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #3498db;
            background: #fff;
        }

        .error-text {
            background: #fdeaea;
            color: #e74c3c;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            border: 1px solid #fadbd8;
            display: none; /* Hidden by default */
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover { background: #2980b9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <i class="fas fa-boxes-stacked fa-3x" style="color:#3498db; margin-bottom:10px;"></i>
        <h2>STOCK MANAGER</h2>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
        </div>
        <div class="input-group">
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div id="error-box" class="error-text">
            <i class="fas fa-exclamation-circle"></i> <span id="error-message"></span>
        </div>

        <button type="submit">
            <span>Login</span>
            <i class="fas fa-sign-in-alt"></i>
        </button>
    </form>
</div>

<script>
    function handleLogin(event) {
        // 1. Prevent the form from refreshing the page
        event.preventDefault();

        // 2. Get the values from the input fields
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;
        const errorBox = document.getElementById('error-box');
        const errorMsg = document.getElementById('error-message');

        // Hide error box at the start of every attempt
        errorBox.style.display = "none";

        // 3. Check Credentials (Matching your PHP logic: user 'admin', pass '1234')
        if (user === "admin" && pass === "1234") {
            
            // Save the session locally so the next page knows who is logged in
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', role);

            // 4. Role-Based Redirection Logic
            if (role === "admin") {
                window.location.href = "admin.html";
            } else if (role === "staff") {
                window.location.href = "sales.html";
            } else {
                // This handles the case where "Select Role" is still empty
                errorBox.style.display = "block";
                errorMsg.innerText = "Please select a role (Admin or Staff).";
            }

        } else {
            // 5. If login fails
            errorBox.style.display = "block";
            errorMsg.innerText = "Invalid username or password. Try admin / 1234";
        }
    }
</script>

</body>
</html>
